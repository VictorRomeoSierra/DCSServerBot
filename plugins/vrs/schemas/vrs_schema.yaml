schema;webhooks_schema:
  type: map
  nullable: false
  mapping:
    regex;(.+):
      type: str
      nullable: false
      range: {min: 1}

schema;default_schema:
  type: map
  nullable: false
  mapping:
    webhooks:
      include: 'webhooks_schema'
    oncall_nudge:
      type: map
      nullable: false
      allowempty: true
      mapping:
        enabled: {type: bool, nullable: false}
        github_pat: {type: str, nullable: false}
        github_owner: {type: str, nullable: false}
        github_repo: {type: str, nullable: false}
        base_branch: {type: str, nullable: false}
        head_branch: {type: str, nullable: false}
        cooldown_seconds: {type: int, nullable: false}
        oncall_role_id: {type: int, nullable: false}
        target_server: {type: str, nullable: false}
        bot_player_names:
          type: seq
          nullable: false
          sequence:
            - {type: str, nullable: false}

schema;element_schema:
  type: map
  func: is_element
  nullable: false
  mapping:
    webhooks:
      include: 'webhooks_schema'

schema;instance_schema:
  type: map
  func: is_node
  nullable: false
  mapping:
    regex;(.+):
      include: 'element_schema'

type: map
func: check_main_structure
nullable: false
mapping:
  DEFAULT:
    include: 'default_schema'
  regex;(.+):
    type: any
    func: any_of
    nullable: false
    enum: ['element_schema', 'instance_schema']
