schema;webhooks_schema:
  type: map
  nullable: false
  mapping:
    regex;(.+):
      type: str
      nullable: false
      range: {min: 1}

schema;default_schema:
  type: map
  nullable: false
  mapping:
    webhooks:
      include: 'webhooks_schema'

schema;element_schema:
  type: map
  func: is_element
  nullable: false
  mapping:
    webhooks:
      include: 'webhooks_schema'

schema;instance_schema:
  type: map
  func: is_node
  nullable: false
  mapping:
    regex;(.+):
      include: 'element_schema'

type: map
func: check_main_structure
nullable: false
mapping:
  DEFAULT:
    include: 'default_schema'
  regex;(.+):
    type: any
    func: any_of
    nullable: false
    enum: ['element_schema', 'instance_schema']
