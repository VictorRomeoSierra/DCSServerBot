schema;auth:
  type: map
  nullable: false
  mapping:
    api_key: {type: text, nullable: false}
    jwt:
      type: map
      nullable: false
      mapping:
        key: {type: text, nullable: false}
        jwks_url: {type: url, nullable: false}

schema;security:
  type: map
  nullable: false
  mapping:
    trusted:
      type: seq
      nullable: false
      sequence:
        - {type: str, nullable: false, unique: true, range: {min: 1}}
    default:
      type: map
      nullable: false
      mapping:
        local: {type: str, nullable: false, enum: ['none', 'api_key', 'jwt', 'disabled']}
        trusted: {type: str, nullable: false, enum: ['none', 'api_key', 'jwt', 'disabled']}
        remote: {type: str, nullable: false, enum: ['none', 'api_key', 'jwt', 'disabled']}

schema;endpoint:
  type: map
  nullable: false
  mapping:
    regex;(.+):
      type: map
      nullable: false
      allowempty: true
      mapping:
        enabled: { type: bool, nullable: false, default: true }
        security:
          type: map
          nullable: false
          mapping:
            local: {type: str, nullable: false, enum: ['none', 'api_key', 'jwt', 'disabled']}
            trusted: {type: str, nullable: false, enum: ['none', 'api_key', 'jwt', 'disabled']}
            remote: {type: str, nullable: false, enum: ['none', 'api_key', 'jwt', 'disabled']}

type: map
nullable: false
mapping:
  DEFAULT:
    type: map
    nullable: false
    mapping:
      prefix: {type: str, nullable: false}
      auth:
        include: 'auth'
      security:
        include: 'security'
      alerting:
        type: map
        nullable: false
        allowempty: true
        mapping:
          pushover_app_token: {type: str, nullable: false}
          pushover_user_key: {type: str, nullable: false}
          voice_channel_id: {type: int, nullable: false}
          relevant_servers:
            type: seq
            nullable: false
            sequence:
              - {type: str, nullable: false}
          enrichment_timeout_secs: {type: number, nullable: false}
      endpoints:
        include: 'endpoint'
